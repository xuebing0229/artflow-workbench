name: Build and publish signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore locked release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Missing SIGNING_KEYSTORE_BASE64"; exit 1; }
          mkdir -p "$RUNNER_TEMP/artflow-signing"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/artflow-signing/artflow-release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/artflow-signing/artflow-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare update package
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -n "s/^[[:space:]]*versionCode[[:space:]]\+\([0-9]\+\).*/\1/p" app/build.gradle | head -n1)"
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"

          APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n1)"
          test -f "$APK_SOURCE"

          TAG="v$VERSION_NAME"
          APK_NAME="artflow-workbench-$VERSION_NAME.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$APK_NAME"
          NOTES="自动测试版 $VERSION_NAME · commit ${GITHUB_SHA:0:7}"

          jq -n             --argjson versionCode "$VERSION_CODE"             --arg versionName "$VERSION_NAME"             --arg apkUrl "$APK_URL"             --arg sha256 "$SHA256"             --arg notes "$NOTES"             '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,notes:$notes}'             > latest.json

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: artflow-workbench-release
          path: ${{ steps.release_meta.outputs.apk_name }}
          if-no-files-found: error

      - name: Publish latest update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          APK_NAME: ${{ steps.release_meta.outputs.apk_name }}
          VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          SHA256: ${{ steps.release_meta.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" latest.json --clobber
            gh release edit "$TAG"               --title "ArtFlow Workbench $VERSION_NAME"               --notes "自动构建的签名测试版。APK SHA-256: $SHA256"
          else
            gh release create "$TAG" "$APK_NAME" latest.json               --title "ArtFlow Workbench $VERSION_NAME"               --notes "自动构建的签名测试版。APK SHA-256: $SHA256"
          fi
