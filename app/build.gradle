plugins {
    id 'com.android.application'
}

def signingKeystorePath = System.getenv('SIGNING_KEYSTORE_PATH') ?: findProperty('SIGNING_KEYSTORE_PATH')
def signingStorePassword = System.getenv('SIGNING_STORE_PASSWORD') ?: findProperty('SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('SIGNING_KEY_ALIAS') ?: findProperty('SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('SIGNING_KEY_PASSWORD') ?: findProperty('SIGNING_KEY_PASSWORD')
def hasReleaseSigning = [signingKeystorePath, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it != null && !it.toString().isBlank() }

android {
    namespace 'cn.artflow.workbench'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.artflow.workbench'
        minSdk 24
        targetSdk 34
        versionCode 1707
        versionName '1.7.7-custom'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingKeystorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is locked. Supply SIGNING_KEYSTORE_PATH, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, and SIGNING_KEY_PASSWORD. Do not create a replacement key.')
        }
    }
}

afterEvaluate {
    tasks.named('preReleaseBuild').configure {
        dependsOn tasks.named('verifyReleaseSigning')
    }
}
